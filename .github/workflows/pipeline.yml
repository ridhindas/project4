name: End-to-End DevOps Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  security-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      # --- STEP 1: SECURITY SCANNING ---
      - name: Install Security Tools
        run: |
          pip install bandit pip-audit
          pip install -r requirements.txt

      - name: SAST Scan (Bandit)
        run: bandit -r . -x ./venv,./__pycache__ -ll

      - name: Dependency Scan (pip-audit)
        run: pip-audit -r requirements.txt

      - name: Build Docker Image
        run: docker build -t ${{ secrets.DOCKER_USERNAME }}/project4-django:${{ github.sha }} .

      # --- DAST Scan (OWASP ZAP) ---
      - name: Run App in Background for DAST
        run: |
          # Using port 8080 on the host to avoid conflicts, mapping to 8000 in container
          docker run -d -p 8080:8000 --name django_app ${{ secrets.DOCKER_USERNAME }}/project4-django:${{ github.sha }}
          sleep 15 # Increased time to allow DB migrations to run

      - name: DAST Scan (OWASP ZAP)
        uses: zaproxy/action-baseline@v0.15.0
        with:
          target: 'http://localhost:8080'
          cmd_options: '-a'

      - name: Stop App Container
        if: always()
        run: |
          # Added '|| true' so this step doesn't fail the pipeline if the container is already gone
          docker stop django_app || true
          docker rm django_app || true

      # --- Push to Docker Hub ---
      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Push Docker Image
        run: |
          docker push ${{ secrets.DOCKER_USERNAME }}/project4-django:${{ github.sha }}
          docker tag ${{ secrets.DOCKER_USERNAME }}/project4-django:${{ github.sha }} ${{ secrets.DOCKER_USERNAME }}/project4-django:latest
          docker push ${{ secrets.DOCKER_USERNAME }}/project4-django:latest

  update-gitops-repo:
    needs: security-and-build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3
        with:
          token: ${{ secrets.PAT_TOKEN }} # Needs Personal Access Token to push back

      - name: Update K8s Manifest with New Image Tag
        run: |
          sed -i "s|image: .*|image: ${{ secrets.DOCKER_USERNAME }}/project4-django:${{ github.sha }}|g" k8s/deployment.yaml
          
      - name: Commit and Push Changes (GitOps Trigger)
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          git add k8s/deployment.yaml
          git commit -m "chore: update image tag to ${{ github.sha }} [skip ci]" || echo "No changes to commit"
          git push
