name: End-to-End DevOps Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  security-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      # --- STEP 1: SECURITY SCANNING (Non-Failing) ---
      - name: Install Security Tools & Dependencies
        run: |
          pip install bandit pip-audit
          pip install -r requirements.txt

      - name: SAST Scan (Bandit)
        run: |
          echo "Running Bandit SAST Scan..."
          # -f markdown outputs a readable report, || true prevents pipeline failure
          bandit -r . -x ./venv,./__pycache__ -f markdown -o bandit_report.md || true
          bandit -r . -x ./venv,./__pycache__ -ll || true # Still print to console for visibility

      - name: Dependency Scan (pip-audit)
        run: |
          echo "Running pip-audit Dependency Scan..."
          # --format markdown creates a shareable report, || true prevents pipeline failure
          pip-audit -r requirements.txt --format markdown > pip_audit_report.md || true
          pip-audit -r requirements.txt || true # Still print to console for visibility

      - name: Build Docker Image
        run: docker build -t ${{ secrets.DOCKER_USERNAME }}/project4-django:${{ github.sha }} .

      # --- DAST Scan (OWASP ZAP) ---
      - name: Run App in Background for DAST
        run: |
          docker run -d -p 8080:8000 -e ALLOWED_HOSTS="*" --name django_app ${{ secrets.DOCKER_USERNAME }}/project4-django:${{ github.sha }}

      - name: Wait for App to be Ready (Health Check)
        run: |
          echo "Waiting for Django to start..."
          for i in {1..30}; do
            if curl -s http://localhost:8080 > /dev/null; then
              echo "✅ App is up and running!"
              exit 0
            fi
            echo "Attempt $i: Server not ready yet..."
            sleep 2
          done
          echo "❌ App failed to start. Here are the container logs:"
          docker logs django_app
          exit 1

      - name: DAST Scan (OWASP ZAP)
        uses: zaproxy/action-baseline@v0.15.0
        with:
          target: 'http://localhost:8080'
          cmd_options: '-a'
        continue-on-error: true # Allows pipeline to continue even if ZAP finds vulnerabilities

      - name: Stop App Container
        if: always()
        run: |
          docker stop django_app || true
          docker rm django_app || true

      # --- Push to Docker Hub ---
      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Push Docker Image
        run: |
          docker push ${{ secrets.DOCKER_USERNAME }}/project4-django:${{ github.sha }}
          docker tag ${{ secrets.DOCKER_USERNAME }}/project4-django:${{ github.sha }} ${{ secrets.DOCKER_USERNAME }}/project4-django:latest
          docker push ${{ secrets.DOCKER_USERNAME }}/project4-django:latest

      # --- STEP 3: UPLOAD SECURITY REPORTS ---
      - name: Upload Security Reports as Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-scan-reports
          path: |
            bandit_report.md
            pip_audit_report.md
            report_html.html
            report_md.md
            report_json.json

  # --- STEP 4: GitOps Implementation (Auto-update manifests) ---
  update-gitops-repo:
    needs: security-and-build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.PAT_TOKEN }}

      - name: Update K8s Manifest with New Image Tag
        run: |
          sed -i "s|image: .*|image: ${{ secrets.DOCKER_USERNAME }}/project4-django:${{ github.sha }}|g" k8s/deployment.yaml
          
      - name: Commit and Push Changes (GitOps Trigger)
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"
          git add k8s/deployment.yaml
          git commit -m "chore: update image tag to ${{ github.sha }} [skip ci]" || echo "No changes to commit"
          git push origin main
