apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: project4-django-app
  namespace: default
spec:
  project: project4
  source:
    repoURL: https://github.com/ridhindas/project4.git
    targetRevision: HEAD
    path: k8s
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
    - CreateNamespace=true
